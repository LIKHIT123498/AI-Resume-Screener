name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Backend (Python)
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run backend tests (placeholder)
      run: |
        echo "No backend tests configured yet."
        # Replace with your actual test command, e.g., pytest backend/

    # Frontend (React)
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: npm install --prefix frontend

    - name: Build frontend
      run: npm run build --prefix frontend

    - name: Run frontend tests (placeholder)
      run: |
        echo "No frontend tests configured yet."
        # Replace with your actual test command, e.g., npm test --prefix frontend